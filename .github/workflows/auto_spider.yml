name: 智慧即時限免去重推播

on:
  schedule:
    # ⏰ 核心改動：改成每 5 分鐘執行一次，這是 GitHub 免費額度的最快極限！
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-spider:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: 複製專案代碼
      uses: actions/checkout@v4

    - name: 讀取發送歷史快取
      uses: actions/cache@v4
      with:
        path: posted_links.txt
        key: spider-history-${{ github.run_id }}
        restore-keys: |
          spider-history-

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 discord-webhook

    - name: 執行限免爬蟲
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python game_freebie_spider.py
