name: 智慧即時限免去重推播

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '是否開啟強制推播測試模式？(勾選後將繞過記憶去重)'
        type: boolean
        required: false
        default: false
      test_url:
        description: '【可選】指定測試的文章網址 (例如貼上特定的久遠文章網址)'
        type: string
        required: false
        default: ''

jobs:
  run-spider:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: 複製專案代碼
      uses: actions/checkout@v4

    # 🎯 核心修復：修正 Cache 機制，確保每一次寫入 posted_links.txt 都能被成功儲存並傳遞到下一次！
    - name: 恢復歷史紀錄快取
      uses: actions/cache/restore@v4
      with:
        path: posted_links.txt
        key: freebie-spider-history-v1
        restore-keys: |
          freebie-spider-history-

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 discord-webhook

    - name: 執行限免爬蟲
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
        TEST_URL: ${{ github.event.inputs.test_url }}
      run: python game_freebie_spider.py

    # 🎯 核心修復：強制將最新更新的 posted_links.txt 儲存回快取，徹底杜絕重複推播！
    - name: 儲存最新歷史紀錄快取
      if: always()
      uses: actions/cache/save@v4
      with:
        path: posted_links.txt
        key: freebie-spider-history-${{ github.run_id }}-${{ github.run_number }}
