name: 智慧即時限免去重推播

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # 🎯 核心改動：在這裡加上一個手動執行的輸入選項
    inputs:
      test_mode:
        description: '是否開啟強制推播測試模式？(勾選後將繞過記憶去重)'
        type: boolean
        required: false
        default: false

jobs:
  run-spider:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: 複製專案代碼
      uses: actions/checkout@v4

    - name: 讀取發送歷史快取
      uses: actions/cache@v4
      with:
        path: posted_links.txt
        key: spider-history-${{ github.run_id }}
        restore-keys: |
          spider-history-

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 discord-webhook

    - name: 執行限免爬蟲
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # 🎯 將 GitHub 的勾選狀態變成環境變數交給 Python
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: python game_freebie_spider.py
