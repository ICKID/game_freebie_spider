name: 智慧即時限免去重推播

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '是否開啟強制推播測試模式？(勾選後將繞過記憶去重)'
        type: boolean
        required: false
        default: false
      test_url:
        description: '【可選】指定測試的文章網址 (例如貼上特定的久遠文章網址)'
        type: string
        required: false
        default: ''

jobs:
  run-spider:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 🎯 給予 Actions 權限，讓它能自動把發送紀錄提交 (Commit) 回你的 Git 倉庫

    steps:
    - name: 複製專案代碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 discord-webhook

    - name: 執行限免爬蟲
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
        TEST_URL: ${{ github.event.inputs.test_url }}
      run: python game_freebie_spider.py

    # 🎯 核心終極防線：自動將最新的 posted_links.txt 提交並 Push 回 Github 專案中！
    - name: 自動提交發送紀錄 (Commit & Push)
      if: github.event.inputs.test_mode != 'true' # 只有在「正式模式」有新文章時才更新歷史紀錄，測試模式不更新
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add posted_links.txt
        git commit -m "chore: 自動更新限免發送紀錄 [skip ci]" || echo "無新紀錄需更新"
        git push
